name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify booking email endpoint
        env:
          VITE_BOOKING_API_URL: ${{ vars.BOOKING_API_URL }}
        run: |
          if [ -z "$VITE_BOOKING_API_URL" ]; then
            echo "::error::BOOKING_API_URL is not set. Add the deployed Google Apps Script web app URL under repository Settings > Secrets and variables > Actions > Variables, then rerun the Pages workflow."
            exit 1
          fi
      - name: Build site
        env:
          VITE_BOOKING_API_URL: ${{ vars.BOOKING_API_URL }}
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
